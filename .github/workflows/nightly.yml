name: Nightly perft

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  perft-depth6:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test perft perft_depth_6 -- --ignored --nocapture